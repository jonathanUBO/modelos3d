<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>Visor Topográfico 3D</title>
    <style>
        html, body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a2436 0%, #090c13 100%);
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Evita que el navegador móvil interprete los gestos de la
               escena 3D (rotar/pinch) como scroll de página, pull-to-refresh
               o zoom del navegador — sin esto, orbitar el modelo con un dedo
               en un celular arrastra la página entera en vez de la cámara. */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        #ui-container {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            right: max(14px, env(safe-area-inset-right));
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
            max-width: 85vw;
            transition: opacity 0.2s ease;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #logos-container {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .logo-img {
            height: 45px;
            width: 45px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        #ui-container.collapsed .ui-detail {
            display: none;
        }

        #ui-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }

        h1 {
            margin: 0;
            font-size: 1.05rem;
            color: #4CAF50;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #ui-toggle {
            font-size: 0.9rem;
            color: #aaa;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #model-info {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 8px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            text-align: center;
            max-width: 85vw;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* Barra de herramientas inferior: pensada para uso con el pulgar en
           celular (botones grandes, separados, con margen para el "notch"
           inferior de iOS vía env(safe-area-inset-bottom)). */
        #toolbar {
            position: absolute;
            left: 50%;
            bottom: max(18px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
        }

        .tool-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #e8ede8;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .tool-btn:active {
            background: rgba(76, 175, 80, 0.45);
        }

        .tool-btn.active {
            background: rgba(76, 175, 80, 0.3);
            color: #7be08a;
        }

        .tool-btn:disabled {
            opacity: 0.35;
        }

        .tool-btn .tool-label {
            position: absolute;
            bottom: -18px;
            font-size: 0.6rem;
            color: #aaa;
            white-space: nowrap;
        }

        @media (max-width: 420px) {
            #ui-container { max-width: none; }
            h1 { font-size: 0.95rem; }
            .logo-img { height: 35px; width: 35px; }
        }

        /* Contenedor de la Brújula / Ejes 3D */
        #axes-container {
            position: absolute;
            left: 15px;
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 100px;
            height: 100px;
            z-index: 10;
            pointer-events: none; /* Que no bloquee el táctil del mapa principal */
        }
        .axis-label {
            position: absolute;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="ui-header">
            <h1>Visor Topográfico 3D</h1>
            <span id="ui-toggle">▲</span>
        </div>
        <div class="ui-detail">
            <div id="model-info">Preparando visor...</div>
            <!-- Rango de elevación y escala: los rellena loadModelInfo() desde la
                 ficha modelo_<id>.json del paquete publicado, para no tener que
                 llevar esos datos en la URL del QR. -->
            <div id="model-extra" style="margin-top:6px; font-size:0.8rem; color:#9ecbff;"></div>
            <div style="margin-top:10px; font-size:0.8rem; color:#aaa;">
                Un dedo: rotar &nbsp;·&nbsp; Dos dedos: zoom / mover
            </div>
        </div>
    </div>

    <div id="logos-container">
        <img src="ejercito.jpg" alt="Logo Ejército" class="logo-img">
        <img src="igm.jpg" alt="Logo IGM" class="logo-img">
    </div>

    <div id="loading">Cargando Modelo 3D...</div>

    <div id="canvas-container"></div>
    <div id="axes-container"></div>

    <div id="toolbar">
        <button id="btn-reset" class="tool-btn" title="Restablecer vista" aria-label="Restablecer vista">⟲</button>
        <button id="btn-texture" class="tool-btn active" title="Foto satelital / color por altura" aria-label="Alternar textura">🛰</button>
        <button id="btn-fullscreen" class="tool-btn" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    </div>

    <!-- Importar Three.js y OBJLoader desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
